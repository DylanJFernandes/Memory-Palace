<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upload Homework</title>
<style>
  body { font-family: system-ui, sans-serif; background: #15171c; color: #eee; margin: 0; padding: 24px; }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 26px; }
  label { display: block; margin: 18px 0 6px; color: #aab; }
  input[type=file], textarea { width: 100%; box-sizing: border-box; background: #22252c; color: #eee;
    border: 1px solid #3a3e48; border-radius: 8px; padding: 12px; font-size: 16px; }
  textarea { min-height: 90px; }
  button { margin-top: 20px; width: 100%; padding: 16px; font-size: 18px; border: 0; border-radius: 10px;
    background: #4c7dff; color: white; }
  button:disabled { background: #444; }
  #status { margin-top: 18px; color: #9fd; min-height: 1.4em; }
</style>
</head>
<body>
<main>
  <h1>Upload your homework</h1>
  <p>Photos or PDFs of the problems for this unit. The AI turns them into the problems in your palace.</p>
  <label for="files">Homework or course material</label>
  <input id="files" type="file" accept="image/*,application/pdf" multiple>
  <label for="notes">Anything the AI should know (optional)</label>
  <textarea id="notes" placeholder="e.g. Only odd problems 1-15 are assigned"></textarea>
  <button id="send">Upload</button>
  <div id="status"></div>
</main>
<script>
const statusLine = document.getElementById("status");
const sendButton = document.getElementById("send");

function readFileAsBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

sendButton.addEventListener("click", async () => {
  const chosenFiles = Array.from(document.getElementById("files").files);
  if (chosenFiles.length === 0) {
    statusLine.textContent = "Choose at least one photo or PDF.";
    return;
  }
  sendButton.disabled = true;
  statusLine.textContent = "Uploading...";
  try {
    const files = await Promise.all(chosenFiles.map(async (file) => ({
      name: file.name,
      mediaType: file.type || "image/jpeg",
      data: await readFileAsBase64(file),
    })));
    const response = await fetch("/materials", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ files, notes: document.getElementById("notes").value }),
    });
    const result = await response.json();
    statusLine.textContent = response.ok
      ? result.message + " Go back to the game and press Create New World."
      : "Upload failed: " + (result.error || response.status);
  } catch (error) {
    statusLine.textContent = "Upload failed: " + error;
  }
  sendButton.disabled = false;
});
</script>
</body>
</html>
